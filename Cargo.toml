[package]
name = "atmosphere"
version = "0.1.0"
edition = "2024"
description = "Holistic GNOME theme switcher and creator for Ubuntu 26+"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
# libadwaita has no gnome_50 feature; v1_9 + gtk_v4_22 is the GNOME 50 floor
# (gnome_50 on gtk4 implies v4_22; system glib must be >= 2.88).
libadwaita = { version = "0.9", features = ["v1_9", "gtk_v4_22"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
image = "0.25"
material-colors = "0.4"
anyhow = "1"
dirs = "6"
regex = "1"
